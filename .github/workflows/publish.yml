# Publishes this package to bats-lang/repository-prototype when src/ or
# bats.toml changes on main. See PUBLISHING-SETUP.md there. Called by
# commit, which the daily relock moves (bats-lang/repository-prototype#269).
name: publish
on:
  push:
    branches: [main]
    paths: ['src/**', 'bats.toml']
jobs:
  publish:
    uses: bats-lang/repository-prototype/.github/workflows/publish.yml@989caaa2e20663583b1a9c7979f93375959d1ce3 # repository-prototype main 989caaa
    secrets: inherit
